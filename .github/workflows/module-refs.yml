name: Module reference policy
on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  module-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/test_check_module_refs.py
      - run: python3 scripts/check-module-refs.py
  latest-module-refs:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/check-module-refs.py --latest
  example-matrix:
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.list.outputs.examples }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "examples=$(python3 scripts/validate-examples.py --list)" >> "$GITHUB_OUTPUT"
  tofu-validate:
    needs: example-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        example: ${{ fromJSON(needs.example-matrix.outputs.examples) }}
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.plugin-cache
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.11.6'
          tofu_wrapper: false
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: actions/cache@v4
        with:
          path: .plugin-cache
          key: tofu-1.11-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.tf') }}-${{ strategy.job-index }}
          restore-keys: |
            tofu-1.11-${{ runner.os }}-${{ runner.arch }}-
      - name: Format, initialize, validate and run plan-only tests
        env:
          EXAMPLE: ${{ matrix.example }}
        run: python3 scripts/validate-examples.py --example "$EXAMPLE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ strategy.job-index }}
          path: .validation/
          include-hidden-files: true
