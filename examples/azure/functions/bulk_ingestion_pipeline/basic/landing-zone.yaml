landing_zone:
  name: fk-azure-bulk-ingestion-pipeline-dev
  default_tags:
    project: foggykitchen
    environment: dev
    landing_zone: fk-azure-bulk-ingestion-pipeline-dev
    managed_by: opentofu

cloud:
  subscription_id: ${jsonencode(subscription_id)}
  tenant_id: ${jsonencode(tenant_id)}
  location: ${jsonencode(location)}
  my_public_ip: ${jsonencode(my_public_ip)}
  resource_group:
    name: rg-fk-azure-bulk-ingestion-pipeline-dev

architecture:
  network:
    vnet:
      name: vnet-fk-azure-bulk-ingestion-pipeline-dev
      cidr: 10.180.0.0/16
    functions_subnet:
      name: snet-fk-bulk-functions
      cidr: 10.180.20.0/24
    postgresql_subnet:
      name: snet-fk-bulk-postgresql
      cidr: 10.180.30.0/24

functions:
  source_path: ${jsonencode(functions_base_path)}
  identity:
    name: id-fk-bulk-functions-dev
  app:
    name: func-fk-bulk-data-dev
    service_plan_name: plan-fk-bulk-data-dev
    sku: EP1
    runtime_stack:
      language: python
      version: "3.12"
    content_share_name: fkbulkdatacontent
    debug_mode: true
  runtime:
    bulkload_name: fnbulkload
    collector_name: fncollector
    validator_name: fnvalidator
  event_hub:
    namespace_name: evhns-fk-bulk-data-dev
    event_hub_name: ingestion
    sku: Standard
    capacity: 1
    partition_count: 2
    message_retention_in_days: 1
  event_grid:
    system_topic_name: egst-fk-bulk-data-dev
    event_subscription_name: blob-created-to-fnbulkload
  api:
    name: apim-fk-bulk-data-dev
    api_name: bulk-ingestion-data
    display_name: Bulk Ingestion Data API
    path_prefix: v1
    validator_route_name: fnvalidator
    validator_route_path: /validate
    publisher_name: ${jsonencode(apim_publisher_name)}
    publisher_email: ${jsonencode(apim_publisher_email)}

data:
  storage:
    account_name: fkbulkdatadev001
    container_name: incoming
  postgresql:
    private_dns_zone_name: fk-azure-bulk-ingestion-pipeline-dev.postgres.database.azure.com
    server:
      name: pg-fk-bulk-data-dev
      version: "16"
      sku: GP_Standard_D2s_v3
      storage_mb: 32768
      admin_login: pgadmin
      admin_password: ${jsonencode(postgresql_admin_password)}
    database:
      name: foggydb
