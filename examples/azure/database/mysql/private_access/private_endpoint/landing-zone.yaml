landing_zone:
  name: fk-azure-mysql-pe-private-access-dev
  default_tags:
    project: foggykitchen
    environment: dev
    landing_zone: fk-azure-mysql-pe-private-access-dev
    managed_by: opentofu

cloud:
  subscription_id: ${jsonencode(subscription_id)}
  tenant_id: ${jsonencode(tenant_id)}
  location: westeurope
  resource_group:
    name: rg-fk-azure-mysql-pe-private-access-dev

architecture:
  private_access:
    mode: private_endpoint
  network:
    vnet:
      name: vnet-fk-azure-mysql-pe-private-access-dev
      cidr: 10.180.0.0/16
    client_subnet:
      name: snet-fk-mysql-pe-client
      cidr: 10.180.10.0/24
    private_endpoint_subnet:
      name: snet-fk-mysql-private-endpoint
      cidr: 10.180.20.0/24
    bastion_subnet:
      cidr: 10.180.30.0/26

workload:
  client:
    name: vm-fk-mysql-pe-client
    shape: Standard_B1s
    admin_username: azureuser
    ssh_authorized_keys: ${jsonencode(ssh_authorized_keys)}

data:
  mysql:
    server:
      name: fk-mysql-pe-private-dev
      private_dns_zone_name: privatelink.mysql.database.azure.com
      version: "8.0.21"
      sku: GP_Standard_D2ds_v4
      storage:
        size_gb: 32
      admin_login: mysqladmin
      admin_password: ${jsonencode(mysql_admin_password)}
    database:
      name: foggydb
