landing_zone:
  name: fk-azure-cosmosdb-private-access-dev
  default_tags:
    project: foggykitchen
    environment: dev
    managed_by: opentofu
  tags:
    landing_zone: fk-azure-cosmosdb-private-access-dev

cloud:
  subscription_id: ${subscription_id}
  tenant_id: ${tenant_id}
  location: westeurope
  resource_group:
    name: rg-fk-azure-cosmosdb-private-access-dev

architecture:
  private_access:
    mode: private_endpoint
  network:
    vnet:
      name: vnet-fk-azure-cosmosdb-private-access-dev
      cidr: 10.160.0.0/16
    client_subnet:
      name: snet-fk-cosmosdb-client
      cidr: 10.160.10.0/24
    private_endpoint_subnet:
      name: snet-fk-cosmosdb-private-endpoint
      cidr: 10.160.20.0/24
    bastion_subnet:
      cidr: 10.160.30.0/26

workload:
  client:
    name: vm-fk-cosmosdb-client
    shape: Standard_B1s
    admin_username: azureuser
    ssh_authorized_keys: ${jsonencode(ssh_authorized_keys)}

data:
  cosmosdb:
    account:
      name: fk-cosmosdb-private-dev
      private_dns_zone_name: privatelink.documents.azure.com
      kind: GlobalDocumentDB
    sql_database:
      name: foggydb
      throughput: 400
    sql_container:
      name: items
      partition_key_paths:
        - /partitionKey
      partition_key_version: 2
