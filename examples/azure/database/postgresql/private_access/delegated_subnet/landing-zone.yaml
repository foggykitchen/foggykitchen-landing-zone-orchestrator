landing_zone:
  name: fk-azure-pg-private-access-dev
  default_tags:
    project: foggykitchen
    environment: dev
    landing_zone: fk-azure-pg-private-access-dev
    managed_by: opentofu

cloud:
  subscription_id: ${jsonencode(subscription_id)}
  tenant_id: ${jsonencode(tenant_id)}
  location: westeurope
  resource_group:
    name: rg-fk-azure-pg-private-access-dev

architecture:
  private_access:
    mode: delegated_subnet
  network:
    vnet:
      name: vnet-fk-azure-pg-private-access-dev
      cidr: 10.130.0.0/16
    client_subnet:
      name: snet-fk-pg-client
      cidr: 10.130.10.0/24
    bastion_subnet:
      cidr: 10.130.30.0/26
    delegated_subnet:
      name: snet-fk-pg-flexible
      cidr: 10.130.20.0/24

workload:
  client:
    name: vm-fk-pg-client
    shape: Standard_B1s
    admin_username: azureuser
    ssh_authorized_keys: ${jsonencode(ssh_authorized_keys)}

data:
  postgresql:
    server:
      name: fk-pg-private-dev
      private_dns_zone_name: fk-azure-pg-private-access-dev.postgres.database.azure.com
      version: "16"
      sku: GP_Standard_D2s_v3
      storage_mb: 32768
      admin_login: pgadmin
      admin_password: ${jsonencode(postgresql_admin_password)}
    database:
      name: foggydb
