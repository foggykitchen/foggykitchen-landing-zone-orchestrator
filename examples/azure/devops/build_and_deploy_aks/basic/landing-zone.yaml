landing_zone:
  name: fk-azure-devops-aks-dev
  default_tags:
    project: foggykitchen
    environment: dev
    landing_zone: fk-azure-devops-aks-dev
    managed_by: opentofu

cloud:
  subscription_name: ${jsonencode(subscription_name)}
  subscription_id: ${jsonencode(subscription_id)}
  tenant_id: ${jsonencode(tenant_id)}
  location: westeurope
  resource_group:
    name: rg-fk-azure-devops-aks-dev

architecture:
  network:
    vnet:
      name: vnet-fk-azure-devops-aks-dev
      cidr: 10.182.0.0/16
    node_subnet:
      name: snet-fk-aks-nodes
      cidr: 10.182.10.0/24
    jump_subnet:
      name: snet-fk-aks-jump
      cidr: 10.182.20.0/24
    private_endpoint_subnet:
      name: snet-fk-acr-private-endpoint
      cidr: 10.182.40.0/24
    bastion_subnet:
      cidr: 10.182.30.0/26
    nat_gateway:
      name: natgw-fk-aks-private-acr
      public_ip_name: pip-fk-aks-private-acr-natgw
    route_table:
      name: rt-fk-aks-empty-udr

workload:
  jump:
    name: vm-fk-aks-devops-jump
    shape: Standard_B2s
    admin_username: azureuser
    ssh_authorized_keys: [] # Public key is passed separately by the example module.

data:
  aks:
    cluster:
      name: aks-fk-devops-dev
      kubernetes_version: "1.34"
      network_plugin: azure
      service_cidr: 10.200.0.0/16
      dns_service_ip: 10.200.0.10
      private_cluster_enabled: true
      outbound_type: userDefinedRouting
    default_node_pool:
      node_count: 1
      vm_size: Standard_D2s_v3
    acr:
      name: fkaksdevopsdev001
      sku: Premium
      admin_enabled: false
      public_network_access_enabled: false
      private_dns_zone_name: privatelink.azurecr.io
      private_endpoint_name: pe-fk-aks-acr-dev

# Terraform creates the pool; cloud-init installs its agent on the jump VM.
# Complete interactive registration using fk-register-build-agent after apply.
devops:
  organization_url: ${jsonencode(organization_url)}
  project:
    name: fk-devops-aks-dev
  github:
    repository: foggykitchen/foggykitchen-hello-world
    branch: master
  build:
    agent_pool_name: ${jsonencode(build_agent_pool_name)}
  pipeline:
    name: fk-build-and-deploy-aks
