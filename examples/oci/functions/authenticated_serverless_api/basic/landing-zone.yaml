landing_zone:
  name: fk-oci-authenticated-serverless-api-dev
  defined_tags: {}
  freeform_tags:
    project: foggykitchen
    environment: dev
    landing_zone: fk-oci-authenticated-serverless-api-dev
    managed_by: opentofu

cloud:
  tenancy_ocid: ${tenancy_ocid}
  compartment_ocid: ${compartment_ocid}
  home_region: ${iam_home_region}
  workload_region: ${workload_region}

architecture:
  network:
    vcn_cidr: 10.90.0.0/16
    api_gateway_subnet_cidr: 10.90.10.0/24
    functions_subnet_cidr: 10.90.20.0/24

functions:
  source_path: ${functions_base_path}
  project:
    name: fk-authenticated-serverless-api-dev
    description: FoggyKitchen OCI authenticated serverless API pattern
  iam:
    dynamic_group_name: fk-authenticated-serverless-api-dev-dg
  runtime:
    ocir_user_name: ${ocir_user_name}
    ocir_user_password: ${ocir_user_password}
    debug_mode: true
    auth_function_name: fnjwtauth
    backend_function_name: fnbackend
  api:
    gateway_name: fk-authenticated-serverless-api-gateway
    path_prefix: /v1
    route_name: backend
    route_path: /backend
    token_header: token
  security:
    jwt_token: ${jwt_token}
